name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v4

      - name: Version schon veröffentlicht?
        id: tag
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version existiert bereits, kein Release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ATLASSIAN_CLIENT_ID: ${{ secrets.VITE_ATLASSIAN_CLIENT_ID }}
          VITE_ATLASSIAN_CLIENT_SECRET: ${{ secrets.VITE_ATLASSIAN_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: betterjira v__VERSION__
          releaseBody: Lade unten den Installer für dein System herunter.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: latest.json erzeugen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          notes=$(awk -v v="$version" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          .github/scripts/updater-manifest.sh "${{ github.repository }}" "v$version" "$notes"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          gh release edit "v$version" --draft=false --latest --notes-file CHANGELOG.md
