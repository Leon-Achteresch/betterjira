name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Board öffnen
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: z. B. 0.6.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Betriebssystem
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, Logs
